<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f0c">
<title>Bar Watch</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f0c;
    --panel: #151b17;
    --line: #26302a;
    --text: #e6ede8;
    --muted: #8a998f;
    --ok: #4fd18b;
    --warn: #f2b84b;
    --bad: #ff5a5f;
    --roi: #4fd18b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    -webkit-user-select: none; user-select: none;
  }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  #stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; touch-action: none; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #roi { position: absolute; border: 2px solid var(--roi); box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
  #roi::after { content: "watch zone"; position: absolute; top: -22px; left: -2px; font-size: 12px; background: var(--roi); color: #000; padding: 1px 6px; border-radius: 3px; }
  #hint { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; font-size: 13px; color: #fff; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 8px; }
  #state { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pill { font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .pill.ok { color: #000; background: var(--ok); border-color: var(--ok); }
  .pill.warn { color: #000; background: var(--warn); border-color: var(--warn); }
  .pill.bad { color: #fff; background: var(--bad); border-color: var(--bad); animation: blink .6s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  body.alarm #stage { box-shadow: inset 0 0 0 6px var(--bad); }
  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 90px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex: 1; min-width: 150px; }
  input[type=range] { flex: 1; accent-color: var(--ok); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 14px; background: #2a352e; color: var(--text); flex: 1; }
  button.primary { background: var(--ok); color: #000; }
  button.danger { background: var(--bad); color: #fff; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  canvas#spark { width: 100%; height: 36px; display: block; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: var(--bg); z-index: 5; }
  #start h1 { margin: 0; font-size: 26px; }
  #start p { margin: 0; color: var(--muted); max-width: 34ch; }
  #start button { flex: none; padding: 14px 28px; font-size: 17px; }
  #err { color: var(--bad); }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="roi" hidden></div>
  <div id="state"><span id="pill" class="pill">idle</span><span id="clock" class="pill num">0s</span></div>
  <div id="hint">Drag a box over the <b>right edge</b> of the Create graph (last ~1 min of bars).</div>
  <div id="start">
    <h1>Bar Watch</h1>
    <p>Point the camera at the Datadog graph. If no green bars show up in the watch zone for the set time, the phone beeps until bars come back.</p>
    <button id="go" class="primary">Start camera</button>
    <p id="err"></p>
  </div>
</div>
<div id="panel">
  <div class="row">
    <div class="stat"><b id="green" class="num">–</b><span>green in zone</span></div>
    <div class="stat"><b id="quiet" class="num">–</b><span>no bars for</span></div>
    <div class="stat" style="flex:2"><canvas id="spark"></canvas><span>last 2 min</span></div>
  </div>
  <div class="row">
    <label>Alarm after <input id="timeout" type="range" min="15" max="300" step="5" value="60"><b id="timeoutV" class="num">60s</b></label>
    <label>Bar threshold <input id="thresh" type="range" min="0.1" max="10" step="0.1" value="0.8"><b id="threshV" class="num">0.8%</b></label>
  </div>
  <div class="row">
    <button id="test">Test sound</button>
    <button id="stop" class="danger" hidden>Silence alarm</button>
  </div>
</div>
<canvas id="work" width="160" height="120" hidden></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), stage = $('stage'), roiEl = $('roi');
const work = $('work'), wctx = work.getContext('2d', { willReadFrequently: true });
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ROI in normalized video coords (0..1). Default: right-center strip.
let roi = load('roi', { x: 0.62, y: 0.3, w: 0.18, h: 0.3 });
let timeoutS = load('timeout', 60), threshPct = load('thresh', 0.8);
$('timeout').value = timeoutS; $('thresh').value = threshPct;

let lastSeen = Date.now(), alarming = false, silencedUntilBars = false, history = [];

// ---------- Audio (works with iOS silent switch via audioSession + <audio>) ----------
let actx, beepAudio, unlocked = false;
function makeBeepWav() {
  const sr = 22050, dur = 1.0, n = sr * dur, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / sr, on = (t % 0.25) < 0.15 && t < 0.75;
    const f = t < 0.25 ? 880 : t < 0.5 ? 1175 : 880;
    v.setInt16(44 + i * 2, on ? Math.sign(Math.sin(2 * Math.PI * f * t)) * 0.8 * 32767 : 0, true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  if (!beepAudio) { beepAudio = new Audio(makeBeepWav()); beepAudio.loop = true; beepAudio.volume = 1; }
  beepAudio.muted = true;
  beepAudio.play().then(() => { beepAudio.pause(); beepAudio.currentTime = 0; beepAudio.muted = false; }).catch(() => { beepAudio.muted = false; });
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
}
function startSound() { if (beepAudio) { beepAudio.currentTime = 0; beepAudio.play().catch(() => {}); } }
function stopSound() { if (beepAudio) beepAudio.pause(); }

// ---------- Wake lock ----------
let wakeLock;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && video.srcObject) keepAwake(); });

// ---------- Camera ----------
$('go').onclick = async () => {
  unlockAudio();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream; await video.play();
    $('start').hidden = true; roiEl.hidden = false; lastSeen = Date.now();
    keepAwake(); layoutRoi(); setInterval(tick, 500);
  } catch (e) {
    $('err').textContent = 'Camera blocked: ' + e.message + '. Allow camera for this site in Safari settings (aA → Website Settings) and reload.';
  }
};

// Displayed video content rect inside the stage (object-fit: contain)
function contentRect() {
  const W = stage.clientWidth, H = stage.clientHeight, vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  const s = Math.min(W / vw, H / vh), w = vw * s, h = vh * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function layoutRoi() {
  const r = contentRect();
  Object.assign(roiEl.style, { left: r.x + roi.x * r.w + 'px', top: r.y + roi.y * r.h + 'px', width: roi.w * r.w + 'px', height: roi.h * r.h + 'px' });
}
window.addEventListener('resize', layoutRoi);
video.addEventListener('loadedmetadata', layoutRoi);

// Draw a new ROI by dragging
let dragStart = null;
const pt = e => { const b = stage.getBoundingClientRect(), r = contentRect();
  return { x: Math.min(1, Math.max(0, (e.clientX - b.left - r.x) / r.w)), y: Math.min(1, Math.max(0, (e.clientY - b.top - r.y) / r.h)) }; };
stage.addEventListener('pointerdown', e => { if (!$('start').hidden) return; dragStart = pt(e); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!dragStart) return; const p = pt(e);
  const n = { x: Math.min(dragStart.x, p.x), y: Math.min(dragStart.y, p.y), w: Math.abs(p.x - dragStart.x), h: Math.abs(p.y - dragStart.y) };
  if (n.w > 0.02 && n.h > 0.02) { roi = n; layoutRoi(); }
});
stage.addEventListener('pointerup', () => { if (dragStart) { dragStart = null; save('roi', roi); lastSeen = Date.now(); } });

// ---------- Detection ----------
// Datadog's bars are a light green (~#7cc77c). Count pixels whose green channel clearly dominates.
function greenFraction() {
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return 0;
  const sx = roi.x * vw, sy = roi.y * vh, sw = roi.w * vw, sh = roi.h * vh;
  wctx.drawImage(video, sx, sy, sw, sh, 0, 0, work.width, work.height);
  const d = wctx.getImageData(0, 0, work.width, work.height).data;
  let g = 0;
  for (let i = 0; i < d.length; i += 4) {
    const R = d[i], G = d[i + 1], B = d[i + 2];
    const max = Math.max(R, G, B), min = Math.min(R, G, B);
    if (G === max && G > 70 && G - R > 18 && G - B > 12 && (max - min) / max > 0.18) g++;
  }
  return 100 * g / (work.width * work.height);
}

function tick() {
  const now = Date.now(), pct = greenFraction(), bars = pct >= threshPct;
  if (bars) { lastSeen = now; silencedUntilBars = false; }
  const quiet = (now - lastSeen) / 1000;
  history.push(pct); if (history.length > 240) history.shift();

  const shouldAlarm = quiet >= timeoutS && !silencedUntilBars;
  if (shouldAlarm && !alarming) { alarming = true; startSound(); }
  if (!shouldAlarm && alarming) { alarming = false; stopSound(); }
  document.body.classList.toggle('alarm', alarming);
  $('stop').hidden = !alarming;

  const pill = $('pill');
  pill.className = 'pill ' + (alarming ? 'bad' : bars ? 'ok' : silencedUntilBars ? '' : 'warn');
  pill.textContent = alarming ? 'Job stopped?' : bars ? 'Bars seen' : silencedUntilBars ? 'Silenced' : 'Waiting for bars';
  $('green').textContent = pct.toFixed(1) + '%';
  $('quiet').textContent = Math.floor(quiet) + 's';
  $('clock').textContent = Math.floor(quiet) + ' / ' + timeoutS + 's';
  drawSpark();
}

function drawSpark() {
  const c = $('spark'), dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const max = Math.max(threshPct * 3, ...history, 1), n = 240;
  const ty = H - (threshPct / max) * H;
  x.strokeStyle = '#f2b84b'; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(0, ty); x.lineTo(W, ty); x.stroke(); x.setLineDash([]);
  x.strokeStyle = '#4fd18b'; x.lineWidth = 1.5; x.beginPath();
  history.forEach((v, i) => { const px = W - (history.length - 1 - i) * (W / n), py = H - (v / max) * H; i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
}

// ---------- Controls ----------
function syncLabels() { $('timeoutV').textContent = timeoutS + 's'; $('threshV').textContent = threshPct + '%'; }
$('timeout').oninput = e => { timeoutS = +e.target.value; save('timeout', timeoutS); syncLabels(); };
$('thresh').oninput = e => { threshPct = +e.target.value; save('thresh', threshPct); syncLabels(); };
$('stop').onclick = () => { silencedUntilBars = true; alarming = false; stopSound(); };
let testing = false;
$('test').onclick = () => {
  unlockAudio(); testing = !testing;
  if (testing) { setTimeout(startSound, 150); $('test').textContent = 'Stop test'; }
  else { stopSound(); $('test').textContent = 'Test sound'; }
};
syncLabels();
</script>
</body>
</html>
